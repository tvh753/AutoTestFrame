[pytest]
#命令行参数--alluredir=./temps --clean=alluredir
#v:增加结果的详细程度,s：关闭I0捕获，input和print可以正常执行
addopts = -vs  --alluredir=./temps --clean-alluredir


#注册标记
markers =
    smoke:冒烟测试
    usermanager:用户管理
    api:接口用例
    ut:单元测试用例

#通过配置显示unicode内容
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

#日志配置
log_file = ./logs/frame.log
#日志级别（DEBUG调试，INFO信息，WARNING警告，ERRO错误，CRITICAL非常严重）
log_file_level = INFO
#日志格式
log_file_format = %(levelname)s %(asctime)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S


# 开启控制台实时日志
log_cli = True
# 设置控制台日志级别
log_cli_level = INFO
# 自定义控制台日志格式 (可选)
log_cli_format = %(levelname)s %(asctime)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S